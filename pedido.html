<script>
function aoCarregarPagina() {
  /* Voltando do gateway com pagamento aprovado ou pendente:
     a sacola já cumpriu o papel dela. */
  const status = U.param('status');
  if (status === 'aprovado' || status === 'pendente') Sacola.limpar();

  PaginaPedido.iniciar();

  if (status === 'aprovado') {
    Aviso.mostrar('Pagamento aprovado. Já estamos preparando seu pedido.');
  } else if (status === 'pendente') {
    Aviso.mostrar('Pagamento em processamento. Avisamos assim que for confirmado.');
  }
}
</script>
