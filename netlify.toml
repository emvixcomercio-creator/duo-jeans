# ============================================================
#  DUO JEANS — configuração de publicação (Netlify)
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

# A função de pagamento precisa ler o catálogo e a configuração
# para recalcular os preços no servidor.
[functions]
  included_files = ["dados/produtos.json", "dados/loja.json", "assets/js/config.js"]
  node_bundler = "esbuild"

# ------------------------------------------------------------
#  CABEÇALHOS DE SEGURANÇA
#  Aplicados a todas as páginas do site.
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Só permite carregar recursos das origens listadas.
    # É o que impede que um script estranho rode na sua loja.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://viacep.com.br; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

    # Obriga o navegador a usar sempre HTTPS neste domínio.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Impede que a loja seja embutida em um site falso (clickjacking).
    X-Frame-Options = "DENY"

    # Impede o navegador de "adivinhar" o tipo de um arquivo.
    X-Content-Type-Options = "nosniff"

    # Não vaza o endereço da página ao sair para outro site.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desliga recursos que a loja não usa.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    Cross-Origin-Opener-Policy = "same-origin"

# ------------------------------------------------------------
#  PAINEL DA LOJA (/admin)
#  O painel precisa falar com o GitHub e carregar o Decap CMS,
#  então tem regras próprias — mais frouxas que as da loja,
#  mas válidas só aqui dentro.
# ------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://raw.githubusercontent.com https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://avatars.githubusercontent.com https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, must-revalidate"
    # O login abre uma janela pop-up que precisa responder à janela
    # que a abriu. Com "same-origin" essa conversa é bloqueada.
    Cross-Origin-Opener-Policy = "unsafe-none"

# ------------------------------------------------------------
#  DADOS DA LOJA
#  Preço e estoque mudam pelo painel. Cache longo aqui faria a
#  cliente ver preço velho por dias — já foi bug uma vez.
# ------------------------------------------------------------
[[headers]]
  for = "/dados/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------
#  LOGIN DO PAINEL (/oauth)
#  A janela de login precisa conversar com a página que a abriu.
#  Com COOP "same-origin" essa conversa é cortada.
# ------------------------------------------------------------
[[headers]]
  for = "/oauth/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Nada de cache nas páginas de compra
[[headers]]
  for = "/checkout.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/pedido.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# Fotos: 1 dia de cache no navegador.
# Era 30 dias, o que fazia sentido quando foto nova sempre tinha nome
# novo. Agora o painel envia foto — e se ela reenviar uma foto corrigida
# com o MESMO nome, a cliente veria a antiga por um mês. Um dia é o
# meio-termo: a CDN do Netlify continua servindo rápido.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# JÁ o catálogo e os estilos você edita direto. Se ficarem em cache
# longo, a cliente continua vendo o preço antigo por semanas.
# Aqui o navegador sempre pergunta ao servidor se mudou.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# As páginas também são revalidadas sempre
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTTP -> HTTPS é o próprio Netlify que faz, para qualquer domínio que
# você ligar no site (opção "Force HTTPS", em Domain management).
# Aqui havia uma regra fixa para duojeans.com.br, um domínio que ainda
# não existe: não fazia nada e sairia errada ao trocar de endereço.

# ------------------------------------------------------------
#  ROTAS DO LOGIN DO PAINEL
#  Endereços curtos para as duas funções de autenticação.
#  O /oauth/callback é o que fica cadastrado no OAuth App do GitHub.
# ------------------------------------------------------------
[[redirects]]
  from = "/oauth/auth"
  to = "/.netlify/functions/oauth-auth"
  status = 200

[[redirects]]
  from = "/oauth/callback"
  to = "/.netlify/functions/oauth-callback"
  status = 200
